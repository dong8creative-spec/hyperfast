<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초고속 편집 실무반</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
        /* 당겨서 새로고침·오버스크롤로 인한 페이지 리로드/초기화 완화 */
        html {
            height: 100%;
            overscroll-behavior: none;
            overscroll-behavior-y: none;
        }
        /* =========================================
           기본 스타일 & 레이아웃
           ========================================= */
        body {
            margin: 0; min-height: 100%; background-color: #525659; overflow-x: hidden;
            user-select: none; font-family: 'pretendard', 'Noto Sans KR', sans-serif;
            overscroll-behavior: none;
            overscroll-behavior-y: none;
        }
        * { box-sizing: border-box; }

        /* [핵심] 플레이어 레이아웃 (PC 기준) */
        #video-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); z-index: 9998; display: none;
            justify-content: center; align-items: center;
            overscroll-behavior: contain;
        }

        .player-box {
            display: flex; /* 가로 배치 */
            width: 95%; max-width: 1500px;
            height: 80vh; /* 높이 80% 사용 */
            background: #111; border-radius: 12px; overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.6); border: 1px solid #333;
        }

        /* 왼쪽: 영상 영역 (75%) */
        .video-area {
            flex: 7.5; background: black; display: flex; flex-direction: column;
            position: relative; border-right: 1px solid #333;
        }
        
        /* 상단 강의 선택 탭 */
        .class-tabs {
            display: flex; background: #222; border-bottom: 1px solid #444; height: 50px; flex-shrink: 0;
        }
        .cls-btn {
            flex: 1; background: #222; color: #888; border: none;
            cursor: pointer; font-weight: bold; font-size: 15px; border-right: 1px solid #333;
            transition: 0.2s; white-space: nowrap;
        }
        .cls-btn.active { background: #e74c3c; color: white; }
        .cls-btn:hover:not(.active) { background: #333; color: white; }

        /* 아이프레임 영역 */
        .iframe-wrap { flex: 1; width: 100%; position: relative; background: #000; overflow: hidden; }
        .iframe-wrap iframe { width: 100%; height: 100%; border: none; position: relative; z-index: 1; }
        /* YouTube 로고·외부 이동 클릭 차단 (우하단·우상단·상단 바) */
        .yt-shield {
            position: absolute; z-index: 2;
            background: transparent; pointer-events: auto;
        }
        .yt-shield-br { bottom: 0; right: 0; width: 130px; height: 58px; }
        .yt-shield-tr { top: 0; right: 0; width: 72px; height: 52px; }
        .yt-shield-top { top: 0; left: 0; right: 0; height: 36px; }
        /* 영상 위 워터마크 (유출 추적) */
        .video-watermark {
            position: absolute; inset: 0; z-index: 3; pointer-events: none;
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(11px, 2vw, 15px); font-weight: 900;
            color: rgba(255, 255, 255, 0.14);
            text-shadow: 0 0 6px rgba(0, 0, 0, 0.9);
            white-space: nowrap; overflow: hidden; padding: 0 12px;
            user-select: none;
        }

        /* 오른쪽: 타임스탬프 영역 (25%) */
        .timestamp-area {
            flex: 2.5; background: #1a1a1a; display: flex; flex-direction: column;
        }
        .ts-header {
            padding: 15px; color: white; font-size: 16px; font-weight: 900;
            border-bottom: 1px solid #333; background: #222; text-align: center; flex-shrink: 0;
        }
        .ts-list {
            flex: 1; overflow-y: auto; padding: 10px;
            -webkit-overflow-scrolling: touch; /* 모바일 스크롤 부드럽게 */
            overscroll-behavior: contain;
            overscroll-behavior-y: contain;
        }
        
        /* 스크롤바 디자인 */
        .ts-list::-webkit-scrollbar { width: 8px; }
        .ts-list::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        .ts-list::-webkit-scrollbar-track { background: #1a1a1a; }

        /* 타임스탬프 버튼 스타일 */
        .ts-item {
            display: flex; align-items: center; width: 100%;
            background: #2b2b2b; color: #ccc; padding: 12px; margin-bottom: 8px;
            border-radius: 6px; cursor: pointer; border: 1px solid #333;
            transition: 0.2s; text-align: left; font-size: 14px;
        }
        .ts-item:hover { background: #e74c3c; color: white; border-color: #c0392b; padding-left: 15px;}
        .ts-time-badge {
            background: black; color: #e74c3c; padding: 3px 8px; border-radius: 4px;
            font-size: 12px; font-weight: bold; margin-right: 10px; min-width: 50px; text-align: center; flex-shrink: 0;
        }
        .ts-item:hover .ts-time-badge { background: white; }

        /* 닫기 버튼 */
        .close-btn {
            position: absolute; top: 15px; right: 25px; z-index: 10001;
            color: white; font-size: 30px; cursor: pointer; font-weight: bold;
            opacity: 0.8; transition: 0.2s; text-shadow: 0 0 5px black;
        }
        .close-btn:hover { opacity: 1; transform: scale(1.1); }

        /* ★★★ [모바일 최적화] ★★★ */
        @media (max-width: 1000px) {
            /* 전체 박스를 화면 꽉 차게 */
            .player-box { 
                flex-direction: column; 
                width: 100%; height: 100%; /* 전체 화면 사용 */
                max-width: none; border-radius: 0; border: none;
            }
            
            /* 상단: 영상 영역 (높이 자동 조절) */
            .video-area { 
                flex: none; /* 고정 크기 아님 */
                width: 100%; 
                border-right: none; 
                border-bottom: 1px solid #333; 
            }

            /* 유튜브 영상 비율 16:9 강제 고정 */
            .iframe-wrap {
                width: 100%;
                aspect-ratio: 16 / 9; /* 최신 브라우저 비율 고정 */
                height: auto; /* 높이는 비율에 따름 */
            }

            /* 탭 버튼 터치하기 편하게 키움 */
            .class-tabs { height: 55px; overflow-x: auto; }
            .cls-btn { font-size: 14px; padding: 0 10px; }

            /* 하단: 타임스탬프 영역 (나머지 공간 다 씀) */
            .timestamp-area { flex: 1; width: 100%; }

            /* 타임스탬프 버튼 더 크게 (터치 용이) */
            .ts-item { padding: 15px; font-size: 15px; margin-bottom: 10px; }
            
            /* 닫기 버튼 위치 조정 */
            .close-btn { top: 10px; right: 15px; font-size: 24px; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px; }
        }

        /* 하단 플로팅 버튼 */
        #video-btn {
            position: fixed; bottom: 25px; right: 25px;
            background: #e74c3c; color: white;
            padding: 10px 20px; min-width: 130px; height: 45px; 
            font-size: 14px; font-weight: 800;
            display: none; justify-content: center; align-items: center; gap: 8px;
            border-radius: 25px; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 900; transition: all 0.2s ease;
        }
        #video-btn:hover { transform: translateY(-3px); background: #c0392b; }

        /* 로그인 & 보안 스타일 */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 9990;
            display: flex; overflow-y: auto;
            overscroll-behavior: contain;
            overscroll-behavior-y: contain;
        }
        .login-left-image { width: 50%; background-color: #f0f0f0; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
        .login-left-image img { width: 100%; height: 100%; object-fit: cover; }
        .login-right-form { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; background: white; min-height: 500px; }
        .form-container { width: 100%; max-width: 400px; text-align: center; }
        h2 { font-size: 32px; margin-bottom: 10px; color: #333; font-weight: 800; }
        p.desc { color: #666; margin-bottom: 30px; line-height: 1.6; font-size: 15px; }
        input { padding: 15px; font-size: 16px; border: 2px solid #ddd; border-radius: 8px; width: 100%; text-align: center; margin-bottom: 15px; outline: none;}
        input:focus { border-color: #333; }
        button { padding: 15px; font-size: 18px; background: #222; color: white; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
        
        #error-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9999; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        #ban-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; color: #ff3333; text-align: center; }
        #blur-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); z-index: 99995; display: none; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }
        #prtsc-blocker { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ff0000; z-index: 99999; display: none; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }
        #pdf-container {
            display: none;
            flex-direction: column; align-items: center;
            width: 100%; height: 100vh;
            padding: 20px 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            overscroll-behavior-y: contain;
        }
        body.session-active { overflow: hidden; }
        canvas { margin-bottom: 20px; box-shadow: 0 5px 25px rgba(0,0,0,0.5); max-width: 100%; height: auto; }
        #watermark-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; display: none; overflow: hidden; }
        .bouncing-text { position: absolute; font-size: 18px; font-weight: 900; color: rgba(255, 255, 255, 0.18); white-space: nowrap; user-select: none; text-shadow: 1px 1px 4px rgba(0,0,0,0.8); }

        @media (max-width: 900px) {
            #login-overlay { flex-direction: column; position: absolute; height: auto; min-height: 100vh; }
            .login-left-image { width: 100%; aspect-ratio: 1 / 1; max-height: none; }
            .login-right-form { width: 100%; padding: 60px 20px; flex: none; }
        }
    </style>
</head>
<body oncontextmenu="return false" ondragstart="return false">

    <div id="login-overlay">
        <div class="login-left-image"><img src="img01.jpg" alt="강의 대표 이미지"></div>
        <div class="login-right-form">
            <div class="form-container">
                <h2>초고속 편집 실무반</h2>
                <p class="desc">구글 명단 기반 인증 시스템<br>접속 기록이 실시간으로 확인됩니다.</p>
                <p id="ip-display" style="color:#27ae60; font-weight:bold; margin-bottom:20px;">서버 연결 대기 중...</p>
                
                <input type="text" id="user-name" placeholder="성함 (등록된 실명 입력)">
                <input type="text" id="access-code" placeholder="보안 코드 4자리 입력">
                <button id="login-btn" onclick="checkSheetAndLogin()">입장하기</button>
            </div>
        </div>
    </div>

    <div id="video-overlay">
        <div class="close-btn" onclick="closeVideoPlayer()">✕</div>
        
        <div class="player-box">
            <div class="video-area">
                <div class="class-tabs">
                    <button class="cls-btn active" onclick="playVideo(0)">1.기본설정</button>
                    <button class="cls-btn" onclick="playVideo(1)">2. 작업 노하우</button>
                    <button class="cls-btn" onclick="playVideo(2)">3. 실제 작업 시 속도 개선 팁</button>
                </div>
                <div class="iframe-wrap" id="iframe-wrap">
                    <iframe id="yt-player" src=""
                        allow="autoplay; encrypted-media"
                        referrerpolicy="strict-origin-when-cross-origin"
                        sandbox="allow-scripts allow-same-origin allow-presentation"
                        title="강의 영상"></iframe>
                    <div class="yt-shield yt-shield-top" aria-hidden="true"></div>
                    <div class="yt-shield yt-shield-tr" aria-hidden="true"></div>
                    <div class="yt-shield yt-shield-br" aria-hidden="true"></div>
                    <div class="video-watermark" id="video-watermark"></div>
                </div>
            </div>

            <div class="timestamp-area">
                <div class="ts-header">⏱️ 타임스탬프 목록</div>
                <div class="ts-list" id="ts-content">
                    <div style="color:#777; text-align:center; margin-top:50px;">데이터 로딩 중...</div>
                </div>
            </div>
        </div>
    </div>

    <div id="video-btn" onclick="openVideoPlayer()"><span>▶ 강의 다시보기</span></div>

    <div id="blur-overlay"><div style="font-size:24px; font-weight:bold;">화면을 클릭해주세요.</div></div>
    <div id="prtsc-blocker"><div style="font-size:60px; font-weight:900;">⚠️ 보안 경고 ⚠️</div></div>
    <div id="ban-overlay"><div style="font-size:80px;">🚫</div><div style="font-size:40px; font-weight:900;">ACCESS DENIED</div></div>

    <div id="error-modal">
        <div class="modal-content">
            <div style="color:#e74c3c; font-size:20px; font-weight:900; margin-bottom:10px;">⚠ 접근 거부</div>
            <div id="error-msg" style="color:#555; margin-bottom:25px;"></div>
            <button onclick="closePopup()" style="background:#e74c3c;">확인</button>
        </div>
    </div>

    <div id="pdf-container"></div>
    <div id="watermark-layer"></div>

    <script>
        /* ============================================================
           ★ [설정] 구글 스프레드 시트 CSV 링크 (자동 적용됨) ★
           ============================================================ */
        const USER_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTi1DDz4qoDr1avgqTieDiRqSW4oGSBMY-Oxk-gGPfb95piTB6Y2MgTbfJ66ahevUTzbM_gUhd2WtpC/pub?output=csv";
        const TIMESTAMP_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRyPyC0zpg7zbQnjQihokiUKUK0cqLhabNMafQ1cYbp5XLbLkTGyx_y17QDtazCo_rTHiFjYB1UD6DI/pub?output=csv"; 

        /* 영상 ID (1~3강, Base64 난독화) */
        const _ENCODED_VIDS = ['N0RTZHlhZ2VrZlU=', 'RFhua0cwWEpxblU=', 'TF9qV0hmZ0l4NUU='];
        const YT_EMBED_HOST = 'https://www.youtube-nocookie.com';
        const YT_MESSAGE_ORIGINS = ['https://www.youtube.com', 'https://www.youtube-nocookie.com'];

        function getVideoId(index) {
            try { return atob(_ENCODED_VIDS[index] || ''); } catch (e) { return ''; }
        }

        function buildEmbedUrl(vid) {
            const params = new URLSearchParams({
                autoplay: '1',
                rel: '0',
                modestbranding: '1',
                enablejsapi: '1',
                fs: '0',
                playsinline: '1',
                disablekb: '1',
                iv_load_policy: '3',
                cc_load_policy: '0',
                controls: '1',
                origin: window.location.origin,
                widget_referrer: window.location.href
            });
            return `${YT_EMBED_HOST}/embed/${vid}?${params.toString()}`;
        }

        function updateVideoWatermark() {
            const el = document.getElementById('video-watermark');
            if (!el) return;
            try {
                const { name, code } = JSON.parse(sessionStorage.getItem(SESSION_KEY) || '{}');
                el.textContent = code && name
                    ? `${code} / ${clientIP} / ${name}`
                    : `${clientIP} / 무단 유출 금지`;
            } catch (e) {
                el.textContent = `${clientIP} / 무단 유출 금지`;
            }
        }

        (function initPlayerGuards() {
            const wrap = document.getElementById('iframe-wrap');
            if (!wrap) return;
            wrap.addEventListener('contextmenu', e => e.preventDefault());
            wrap.addEventListener('mousedown', e => { if (e.button === 1) e.preventDefault(); });
            wrap.addEventListener('auxclick', e => e.preventDefault());
            wrap.addEventListener('dragstart', e => e.preventDefault());
        })();

        /* 변수 설정 */
        let fetchedTimestamps = [];
        let clientIP = "IP 확인 중";
        let failCount = parseInt(localStorage.getItem('accessFailCount') || 0);
        const maxAttempts = 5;
        const SESSION_KEY = 'hyperfastSession';

        function saveSession(name, code) {
            try {
                sessionStorage.setItem(SESSION_KEY, JSON.stringify({ name, code }));
            } catch (e) {}
        }

        function restoreSession() {
            if (failCount >= maxAttempts) return;
            if (new URLSearchParams(window.location.search).get('admin') === 'pass') return;
            try {
                const raw = sessionStorage.getItem(SESSION_KEY);
                if (!raw) return;
                const { name, code } = JSON.parse(raw);
                if (name && code) enterSuccess(name, code);
            } catch (e) {}
        }

        // [초기화] 타임스탬프 데이터 미리 가져오기
        fetch(TIMESTAMP_SHEET_URL)
            .then(res => {
                if(!res.ok) throw new Error("네트워크 오류");
                return res.text();
            })
            .then(text => {
                // 타임스탬프 시트는 강의번호, 시간, 설명 3개 컬럼 필요
                fetchedTimestamps = parseCSV(text, 3);
                console.log("타임스탬프 로드 완료:", fetchedTimestamps.length + "개");
                console.log("타임스탬프 데이터 샘플:", fetchedTimestamps.slice(0, 3));
            })
            .catch(err => {
                console.error("타임스탬프 로드 실패:", err);
                fetchedTimestamps = [];
            });

        // CSV 파싱 함수 (따옴표 처리 개선)
        // minColumns: 최소 필요한 컬럼 수 (기본값: 2)
        function parseCSV(text, minColumns = 2) {
            const rows = [];
            const lines = text.split(/\r?\n/);
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                const row = [];
                let current = '';
                let inQuotes = false;
                
                for (let j = 0; j < line.length; j++) {
                    const char = line[j];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        row.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                row.push(current.trim());
                rows.push(row);
            }
            
            // 첫 번째 행(헤더) 제거하고, 최소 컬럼 수를 만족하는 행만 반환
            const dataRows = rows.slice(1).filter(r => {
                // 최소 컬럼 수를 만족하고, 모든 필수 컬럼이 비어있지 않은지 확인
                if (r.length < minColumns) return false;
                for (let i = 0; i < minColumns; i++) {
                    if (!r[i] || r[i].trim() === '') return false;
                }
                return true;
            });
            
            console.log("CSV 파싱 결과:", dataRows.length + "개 행 (최소 컬럼: " + minColumns + ")");
            if (dataRows.length > 0) {
                console.log("첫 번째 데이터 샘플:", dataRows[0]);
            }
            
            return dataRows;
        }

        /* [엔터키 이동 로직] */
        document.getElementById('user-name').addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                document.getElementById('access-code').focus();
            }
        });
        document.getElementById('access-code').addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                document.getElementById('login-btn').click();
            }
        });

        /* 관리자 프리패스 */
        (function() {
            if (new URLSearchParams(window.location.search).get('admin') === 'pass') {
                window.addEventListener('DOMContentLoaded', () => {
                     document.getElementById('ip-display').innerText = "✅ 관리자 프리패스";
                     document.getElementById('user-name').value = "관리자";
                     document.getElementById('access-code').value = "MASTER"; 
                     const btn = document.getElementById('login-btn');
                     btn.innerText = "관리자 입장";
                     btn.onclick = () => enterSuccess("관리자", "MASTER");
                });
            }
        })();

        /* 명단 확인 및 로그인 */
        async function checkSheetAndLogin() {
            if (failCount >= maxAttempts) { showBan(); return; }
            const name = document.getElementById('user-name').value.trim();
            const code = document.getElementById('access-code').value.trim();
            const btn = document.getElementById('login-btn');
            
            if(!name || !code) { alert("정보를 모두 입력해주세요."); return; }
            btn.disabled = true; btn.innerText = "확인 중...";

            try {
                const res = await fetch(USER_SHEET_URL);
                if(!res.ok) throw new Error("시트 연결 실패");
                const text = await res.text();
                
                // 사용자 시트는 이름, 코드 2개 컬럼만 필요
                const users = parseCSV(text, 2);
                
                console.log("사용자 명단 로드:", users.length + "명");
                console.log("입력된 정보 - 이름:", name, "코드:", code);
                
                // 대소문자 구분 없이, 공백 제거 후 비교
                const found = users.find(u => {
                    const sheetName = (u[0] || '').trim();
                    const sheetCode = (u[1] || '').trim();
                    const inputName = name.trim();
                    const inputCode = code.trim();
                    
                    // 정확히 일치하거나, 대소문자 무시하고 비교
                    const nameMatch = sheetName === inputName || sheetName.toLowerCase() === inputName.toLowerCase();
                    const codeMatch = sheetCode === inputCode || sheetCode.toLowerCase() === inputCode.toLowerCase();
                    
                    return nameMatch && codeMatch;
                });

                if (found) {
                    try { localStorage.removeItem('accessFailCount'); } catch(e){}
                    failCount = 0; // 성공 시 실패 카운트 초기화
                    enterSuccess(name, code);
                } else {
                    failCount++;
                    localStorage.setItem('accessFailCount', failCount);
                    btn.disabled = false; btn.innerText = "입장하기";
                    
                    console.log("로그인 실패 - 등록된 사용자 목록:", users.map(u => `${u[0]} / ${u[1]}`));
                    
                    if (maxAttempts - failCount <= 0) {
                        showBan();
                    } else {
                        document.getElementById('error-msg').innerHTML = `정보 불일치.<br>(남은 기회: ${maxAttempts - failCount}회)`;
                        document.getElementById('error-modal').style.display = 'flex';
                    }
                }
            } catch (e) {
                console.error(e);
                alert("서버 명단을 불러오지 못했습니다.\n잠시 후 다시 시도하거나 관리자에게 문의하세요.");
                btn.disabled = false; btn.innerText = "입장하기";
            }
        }

        function enterSuccess(name, code) {
            saveSession(name, code);
            document.body.classList.add('session-active');
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('pdf-container').style.display = 'flex';
            document.getElementById('watermark-layer').style.display = 'block';
            document.getElementById('video-btn').style.display = 'flex';
            renderPDF();
            initWatermark(`${code} / ${clientIP} / ${name} / 유출 시 모든 책임은 저 스스로에게 있습니다`);
        }

        restoreSession();

        /* 타임스탬프 포맷팅 함수 
         * 60분(3600초) 이상: 시:분:초 형식 (예: 1:05:30)
         * 60분 미만: 분:초 형식 (예: 59:59, 최대 59:59까지)
         */
        function formatTimestamp(seconds) {
            // 초 단위를 숫자로 변환
            const totalSeconds = parseInt(seconds);
            if (isNaN(totalSeconds) || totalSeconds < 0) {
                return "0:00";
            }
            
            // 3600초(60분) 이상인지 확인
            if (totalSeconds >= 3600) {
                // 시:분:초 형식
                const hours = Math.floor(totalSeconds / 3600);
                const minutes = Math.floor((totalSeconds % 3600) / 60);
                const secs = totalSeconds % 60;
                return `${hours}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            } else {
                // 분:초 형식 (59:59까지)
                const minutes = Math.floor(totalSeconds / 60);
                const secs = totalSeconds % 60;
                return `${minutes}:${secs.toString().padStart(2, '0')}`;
            }
        }

        /* 영상 플레이어 및 타임스탬프 로직 */
        function openVideoPlayer() {
            document.getElementById('video-overlay').style.display = 'flex';
            updateVideoWatermark();
            playVideo(0);
        }
        function closeVideoPlayer() { 
            document.getElementById('video-overlay').style.display = 'none'; 
            const iframe = document.getElementById('yt-player');
            if (iframe) {
                // iframe을 완전히 비워서 영상 정지
                iframe.src = "about:blank";
            }
        }

        function playVideo(index) {
            if (index < 0 || index >= _ENCODED_VIDS.length) return;

            const vid = getVideoId(index);
            if (!vid) {
                alert('영상을 불러올 수 없습니다.');
                return;
            }

            updateVideoWatermark();

            const iframe = document.getElementById('yt-player');
            if (!iframe) {
                console.error('iframe 요소를 찾을 수 없습니다.');
                return;
            }

            // 탭 버튼 활성화 상태 업데이트
            document.querySelectorAll('.cls-btn').forEach((b, i) => {
                b.className = (i === index) ? 'cls-btn active' : 'cls-btn';
            });

            // 타임스탬프 데이터 필터링 및 표시
            // CSV 구조: row[0] = 강의번호(1,2,3), row[1] = 초 단위 시간, row[2] = 라벨/설명
            const currentData = fetchedTimestamps.filter(row => {
                const lectureNum = parseInt(row[0]);
                return !isNaN(lectureNum) && lectureNum === (index + 1);
            });
            
            const container = document.getElementById('ts-content');
            container.innerHTML = "";

            if(currentData.length === 0) {
                container.innerHTML = "<div style='color:#777; text-align:center; padding:20px;'>타임스탬프가 없습니다.</div>";
            } else {
                // 시간 순서대로 정렬
                currentData.sort((a, b) => {
                    const timeA = parseInt(a[1]) || 0;
                    const timeB = parseInt(b[1]) || 0;
                    return timeA - timeB;
                });

                currentData.forEach((row, idx) => {
                    // row[0] = 강의번호, row[1] = 초 단위 시간, row[2] = 라벨
                    const seconds = parseInt(row[1]);
                    const label = row[2] || "";
                    
                    // 유효한 데이터인지 확인
                    if (!isNaN(seconds) && seconds >= 0 && label.trim() !== "") {
                        const timeStr = formatTimestamp(seconds);

                        const btn = document.createElement('div');
                        btn.className = 'ts-item';
                        btn.innerHTML = `<span class="ts-time-badge">${timeStr}</span> ${label}`;
                        btn.onclick = () => seekTo(seconds);
                        container.appendChild(btn);
                    } else {
                        console.warn(`유효하지 않은 타임스탬프 데이터:`, row);
                    }
                });
            }

            // iframe을 완전히 새로 로드하기 위해 먼저 비우기
            iframe.src = "about:blank";
            
            // 짧은 지연 후 새 URL 로드 (iframe이 완전히 비워진 후 로드)
            setTimeout(() => {
                iframe.src = buildEmbedUrl(vid);
            }, 100);
        }

        function seekTo(seconds) {
            const iframe = document.getElementById('yt-player');
            if (!iframe || !iframe.contentWindow) return;
            const msg = JSON.stringify({ event: 'command', func: 'seekTo', args: [seconds, true] });
            YT_MESSAGE_ORIGINS.forEach(origin => iframe.contentWindow.postMessage(msg, origin));
        }

        /* 기타: PDF, 워터마크, IP */
        fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d=>{
            clientIP=d.ip;
            document.getElementById('ip-display').innerText=`접속 IP: ${clientIP}`;
            updateVideoWatermark();
        });
        function showBan() {
            try { sessionStorage.removeItem(SESSION_KEY); } catch(e) {}
            document.body.classList.remove('session-active');
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('ban-overlay').style.display = 'flex';
        }
        function closePopup() { document.getElementById('error-modal').style.display = 'none'; }
        
        async function renderPDF() {
            try {
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
                const pdf = await pdfjsLib.getDocument('./hhyperfastt.pdf').promise;
                const container = document.getElementById('pdf-container');
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 1.5 });
                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width; canvas.height = viewport.height;
                    await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
                    container.appendChild(canvas);
                }
            } catch(e) {
                console.error('PDF 렌더링 오류:', e);
                const container = document.getElementById('pdf-container');
                container.innerHTML = '<div style="color:#e74c3c; padding:20px; text-align:center;">PDF 파일을 불러올 수 없습니다. 파일 경로를 확인해주세요.</div>';
            }
        }
        
        function initWatermark(text) {
            const layer = document.getElementById('watermark-layer');
            for(let i=0; i<3; i++) {
                const el = document.createElement('div');
                el.className = 'bouncing-text'; el.innerText = text;
                layer.appendChild(el);
                animate(el);
            }
        }
        function animate(el) {
            let x = Math.random()*window.innerWidth, y = Math.random()*window.innerHeight, dx=1.5, dy=1.5;
            function step() {
                x+=dx; y+=dy;
                if(x<=0 || x+el.offsetWidth>=window.innerWidth) dx=-dx;
                if(y<=0 || y+el.offsetHeight>=window.innerHeight) dy=-dy;
                el.style.left=x+'px'; el.style.top=y+'px';
                requestAnimationFrame(step);
            }
            step();
        }
        document.addEventListener('keydown', e => {
            if(new URLSearchParams(window.location.search).get('admin')==='pass') return;
            if(e.key==="PrintScreen") { document.getElementById('prtsc-blocker').style.display='flex'; setTimeout(showBan, 1000); }
        });
    </script>
</body>
